name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level. Without this the workflow inherits the
# repository default, which may be read-write, and every job gets a token
# with more authority than it uses. Jobs that need more raise it themselves.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
